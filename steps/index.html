<div id="chart" style="height:600px"></div>
<div id="osc" style="height:350px"></div>
<script src="https://cdn.jsdelivr.net/npm/@luxalgo/vela/dist/vela.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@luxalgo/vela-pinets/dist/vela-pinets.global.min.js"></script>
<script>
  const chart = new Vela.Vela('#chart', {
    symbol: 'coinbase:BTC-USD',
    timeframe: '1',
    theme: 'dark',
    live: true
  });
  chart.data
    .registerProvider('coinbase', new Vela.CoinbaseProvider())
    .registerProvider('hyperliquid', new Vela.HyperliquidProvider());

  chart.registerEngine('pine', new VelaPinets.PineEngine());

  // Hyperliquid close as a line on the Coinbase candles
  chart.addIndicator(`//@version=6
indicator("Hyperliquid BTC", overlay=true)
plot(request.security("HYPERLIQUID:BTC", timeframe.period, close), "Hyperliquid", color.orange)`);

  // Bollinger Bands (20, 2)
  chart.addIndicator(`//@version=6
indicator("Bollinger Bands", overlay=true)
[mid, upper, lower] = ta.bb(close, input.int(20, "Length"), input.float(2.0, "Mult"))
plot(mid, "Basis", color.blue)
plot(upper, "Upper", color.green)
plot(lower, "Lower", color.red)`);

  // Keltner Channel (EMA 20, ATR 10, mult 2)
  chart.addIndicator(`//@version=6
indicator("Keltner Channel", overlay=true)
len = input.int(20, "EMA Length")
atrLen = input.int(10, "ATR Length")
mult = input.float(2.0, "Mult")
basis = ta.ema(close, len)
rng = ta.atr(atrLen)
plot(basis, "Basis", color.gray)
plot(basis + mult * rng, "Upper", color.purple)
plot(basis - mult * rng, "Lower", color.purple)`);

  // Bottom chart: only the two oscillators, price pane collapsed
  const osc = new Vela.Vela('#osc', {
    symbol: 'coinbase:BTC-USD',
    timeframe: '1',
    theme: 'dark',
    live: true
  });
  osc.data.registerProvider('coinbase', new Vela.CoinbaseProvider());
  osc.addNativeIndicator('ultimate-oscillator');
  osc.addNativeIndicator('awesome-oscillator');
  osc.ready().then(() => osc.panes.collapse('price'));

  // Time sync: checked every frame because live bars do not fire viewport:changed
  const HALF_BAR = 30 * 1000;
  const same = (a, b) => Math.abs(a.from - b.from) < HALF_BAR && Math.abs(a.to - b.to) < HALF_BAR;
  let leader = chart, lastTouch = 0;
  function mark(c) { return (e) => { if (e.type === 'pointermove' && !e.buttons) return; leader = c; lastTouch = Date.now(); }; }
  [['chart', chart], ['osc', osc]].forEach(([id, c]) => {
    const el = document.getElementById(id);
    ['pointerdown', 'pointermove', 'wheel'].forEach((ev) => el.addEventListener(ev, mark(c), { passive: true }));
  });
  (function tick() {
    const src = Date.now() - lastTouch < 2000 ? leader : chart;
    const dst = src === chart ? osc : chart;
    const a = src.getVisibleRange(), b = dst.getVisibleRange();
    if (a && b && !same(a, b)) dst.setVisibleRange(a);
    requestAnimationFrame(tick);
  })();
</script>
